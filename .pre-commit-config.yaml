repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        files: ^MotorGraphico/(include|src|examples)/.*\.(h|hpp|cpp)$

  - repo: local
    hooks:
      - id: build-demo-debug
        name: build demo_resource_manager (Debug)
        entry: bash -c 'cd MotorGraphico && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug >/dev/null && cmake --build build --target demo_resource_manager -j'
        language: system
        pass_filenames: false
        stages: [pre-push]
